<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>מפת המתחם · FORUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--card:#161a23;--line:rgba(255,255,255,.09);--text:#f2f1ec;--muted:#a8aab2;--dim:#6f727b;--gold:#d6b880}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Heebo",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:150px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.top b{color:var(--text)}
.hero{padding:24px 0 6px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.26em;color:var(--gold);font-weight:700;margin-bottom:8px}
h1{font-size:28px;font-weight:800;line-height:1.2;margin-bottom:8px}
.lead{color:var(--muted);font-size:15px;font-weight:300;max-width:620px;margin:0 auto}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:18px;align-items:start}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.tools button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;width:38px;height:34px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.scroller{overflow:auto;border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch;max-height:78vh}
.board{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.board img{display:block;width:100%;height:auto;pointer-events:none;opacity:.92}
.pin{position:absolute;transform:translate(50%,-50%);display:flex;align-items:center;gap:6px;background:#0b0d12;color:#fff;border:2px dashed var(--gold);border-radius:999px;padding:3px 10px 3px 4px;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:grab;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,.35);z-index:2}
.pin b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#0b0d12;font-size:12px}
.pin.ok{border-style:solid;background:#2a2412}
.pin.sel{z-index:8;outline:3px solid #fff;background:var(--gold);color:#0b0d12}
.pin.sel b{background:#0b0d12;color:var(--gold)}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.side h3{font-size:15px;font-weight:800;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid var(--line);font-size:14.5px;border-radius:8px;cursor:pointer}
.row:first-of-type{border-top:0}
.row .k{min-width:24px;height:24px;border-radius:50%;background:rgba(214,184,128,.15);color:var(--gold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.row .n{flex:1}
.row .st{font-size:12px;color:var(--dim)}
.row .st.ok{color:var(--gold)}
.row.sel{background:rgba(214,184,128,.12)}
.row.gone .n{text-decoration:line-through;color:var(--dim)}
.add{display:flex;gap:6px;margin-top:12px}
input[type=text],textarea{width:100%;background:#0e1118;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font:inherit;font-size:16px}
textarea{min-height:90px;margin-top:6px}
.add button,.btn{background:var(--gold);color:#0b0d12;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.add button{padding:0 16px}
.btn{width:100%;padding:15px;font-size:16px;margin-top:14px}
.btn:disabled{opacity:.6}
label.f{display:block;font-size:14px;font-weight:600;margin-top:14px}
.err{display:none;color:#ffb3b3;font-size:13px;margin-top:8px}
.done{display:none;text-align:center;padding:20px 0}
.done.show{display:block}
/* פס הנחיה תחתון */
.guide{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,24,.97);border-top:1.5px solid var(--gold);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.guide .in{max-width:1100px;margin:0 auto}
.guide .q{font-size:15px;margin-bottom:8px}
.guide .q b{color:var(--gold);font-size:17px}
.guide .q small{display:block;color:var(--muted);font-size:13px}
.guide .acts{display:flex;gap:8px}
.guide .acts button{flex:1;border-radius:10px;padding:11px 6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text)}
.guide .acts .yes{background:var(--gold);color:#0b0d12;border:0}
.prog{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:30px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  h1{font-size:23px}
  .pin{padding:2px;font-size:12px;border-width:2px}
  .pin .nm{display:none}
  .pin.sel .nm{display:inline;padding-left:6px}
  .scroller{max-height:66vh}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><b>AI Lab · מאיר לביא</b><span>FORUM BUSINESS CLUB</span></div>

<div class="hero">
  <div class="eyebrow">מפת המתחם</div>
  <h1>עזור לנו לדייק איפה כל דבר נמצא</h1>
  <p class="lead">נעבור יחד חלל אחרי חלל. לכל אחד: אם הוא במקום הנכון לוחצים "נכון", ואם לא, <b>לוחצים במפה איפה הוא באמת</b>. כ-2 דקות.</p>
</div>

<div class="layout">
  <div>
    <div class="tools"><button id="zin" aria-label="הגדל">+</button><button id="zout" aria-label="הקטן">−</button><span>הגדלה, ואז גוללים במפה עם האצבע</span></div>
    <div class="scroller" id="scroller" dir="ltr"><div class="board" id="board"><img src="plan.jpg" alt="תוכנית הקומה"></div></div>
  </div>
  <div class="side">
    <h3>כל החללים</h3>
    <div id="list"></div>
    <div class="add"><input type="text" id="newName" placeholder="להוסיף חלל שחסר"><button id="addBtn">הוסף</button></div>
    <label class="f" for="notes">משהו שחשוב שנדע?</label>
    <textarea id="notes" placeholder="למשל: האולם נפתח למרפסת רק בצד אחד…"></textarea>
    <div class="err" id="err"></div>
    <button class="btn" id="send">שלח את המפה ←</button>
    <div class="done" id="done"><div style="font-size:40px">✅</div><b>תודה! המפה אצלנו.</b></div>
  </div>
</div>
<div class="foot">AI Lab · מאיר לביא</div>
</div>

<div class="guide" id="guide"><div class="in">
  <div class="prog"><i id="prog"></i></div>
  <div class="q" id="gq"></div>
  <div class="acts" id="gacts">
    <button class="yes" id="gYes">✓ נכון</button>
    <button id="gNo">לא קיים</button>
    <button id="gSkip">דלג</button>
  </div>
</div></div>

<script>
const WEB3FORMS_KEY='9ba5abaf-d501-44db-a33d-d5028c89e0ef', WA='972546500795';
// x,y באחוזים מהתוכנית (x משמאל). null = עוד לא מוקם
const PINS=[
 ['כניסה ומעליות',61,5],['שלט מואר',48,16],['קבלה',58,20],['פודקאסט',37,21],
 ['לאונג\'',19,11],['בר פנימי',80,22],['10 משרדים',21,47],['חדר ישיבות',41,31],
 ['עמדות עבודה',44,66],['אולם כנסים',27,82],['חדר ישיבות גדול (מחיצה מתקפלת)',20,68],
 ['מרפסת',64,58],['בר חיצוני',83,62],
 ['אולם אירועים',null,null],['חדר ישיבות נוסף',null,null],['מטבח / קפה',null,null]
];
const board=document.getElementById('board'), scroller=document.getElementById('scroller'), list=document.getElementById('list');
const items=[]; let cur=null, zoom=1;

function make(name,x,y){
  const it={name,x,y,state:'guess',el:null,k:items.length+1};  // state: guess | ok | gone | skip
  const el=document.createElement('div'); el.className='pin'; el.dir='rtl'; el.innerHTML='<b></b><span class="nm"></span>';
  el.querySelector('b').textContent=it.k; el.querySelector('.nm').textContent=name; it.el=el; board.appendChild(el);
  const r=document.createElement('div'); r.className='row'; r.innerHTML='<span class="k"></span><span class="n"></span><span class="st"></span>';
  r.querySelector('.k').textContent=it.k; r.querySelector('.n').textContent=name; it.r=r; it.st=r.querySelector('.st');
  r.onclick=()=>{ select(it); if(it.x!=null) scrollTo(it); }; list.appendChild(r);
  dragPin(it); items.push(it); draw(it); return it;
}
function draw(it){
  const has=it.x!=null && it.state!=='gone';
  it.el.style.display=has?'':'none';
  if(has){ it.el.style.right=(100-it.x)+'%'; it.el.style.top=it.y+'%'; }
  it.el.classList.toggle('ok',it.state==='ok'); it.el.classList.toggle('sel',it===cur);
  it.r.classList.toggle('sel',it===cur); it.r.classList.toggle('gone',it.state==='gone');
  it.st.textContent={guess:it.x==null?'לא מוקם':'השערה',ok:'✓',gone:'לא קיים',skip:'דילגת'}[it.state];
  it.st.className='st'+(it.state==='ok'?' ok':'');
}
function drawAll(){ items.forEach(draw); guide(); }
function select(it){ cur=it; drawAll(); }
function next(){ const i=items.indexOf(cur); cur=items.slice(i+1).find(t=>t.state==='guess')||items.find(t=>t.state==='guess')||null; drawAll(); if(cur&&cur.x!=null) scrollTo(cur); }
function guide(){
  const done=items.filter(t=>t.state!=='guess').length; document.getElementById('prog').style.width=(done/items.length*100)+'%';
  const q=document.getElementById('gq'), acts=document.getElementById('gacts');
  if(!cur){ q.innerHTML='<b>סיימנו 🎉</b><small>אפשר לגרור תוויות לתיקון, להוסיף הערה, ולשלוח.</small>'; acts.style.display='none'; return; }
  acts.style.display='';
  const n=cur.name.replace(/</g,'');
  q.innerHTML = cur.x==null
    ? `<b>${cur.k}. ${n}</b><small>לחץ במפה איפה זה נמצא, או "לא קיים".</small>`
    : `<b>${cur.k}. ${n}</b><small>זה המקום הנכון? אם לא, לחץ במפה על המקום האמיתי.</small>`;
  document.getElementById('gYes').style.display=cur.x==null?'none':'';
}
function scrollTo(it){ const b=board.getBoundingClientRect(), s=scroller.getBoundingClientRect();
  const px=b.width*it.x/100, py=b.height*it.y/100;
  scroller.scrollTo({left:px-s.width/2, top:py-s.height/2, behavior:'smooth'});
  if(window.innerWidth<820){ const top=scroller.getBoundingClientRect().top+window.scrollY-10; if(Math.abs(window.scrollY-top)>40) window.scrollTo({top,behavior:'smooth'}); }
}
// לחיצה במפה = מיקום החלל הנבחר
board.addEventListener('click',e=>{
  if(!cur||e.target.closest('.pin')) return;
  const b=board.getBoundingClientRect();
  cur.x=(e.clientX-b.left)/b.width*100; cur.y=(e.clientY-b.top)/b.height*100; cur.state='ok';
  const done=cur; draw(done); setTimeout(next,350);
});
// גרירת תווית (מחשב וטלפון)
function dragPin(it){
  const el=it.el;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation(); el.setPointerCapture(e.pointerId); select(it);
    let moved=false; const sx=e.clientX, sy=e.clientY;
    const move=ev=>{ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6&&!moved) return; moved=true;
      const b=board.getBoundingClientRect();
      it.x=Math.max(0,Math.min(100,(ev.clientX-b.left)/b.width*100)); it.y=Math.max(0,Math.min(100,(ev.clientY-b.top)/b.height*100));
      el.style.right=(100-it.x)+'%'; el.style.top=it.y+'%'; };
    const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
      if(moved){ it.state='ok'; draw(it); setTimeout(next,350); } };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  });
}
document.getElementById('gYes').onclick=()=>{ if(cur){ cur.state='ok'; next(); } };
document.getElementById('gNo').onclick=()=>{ if(cur){ cur.state='gone'; next(); } };
document.getElementById('gSkip').onclick=()=>{ if(cur){ cur.state='skip'; next(); } };
function setZoom(z){ const s=scroller, cx=(s.scrollLeft+s.clientWidth/2)/board.offsetWidth, cy=(s.scrollTop+s.clientHeight/2)/board.offsetHeight;
  zoom=Math.max(1,Math.min(3,z)); board.style.width=(zoom*100)+'%';
  s.scrollLeft=cx*board.offsetWidth-s.clientWidth/2; s.scrollTop=cy*board.offsetHeight-s.clientHeight/2; }
document.getElementById('zin').onclick=()=>setZoom(zoom+0.5);
document.getElementById('zout').onclick=()=>setZoom(zoom-0.5);
document.getElementById('addBtn').onclick=()=>{ const i=document.getElementById('newName'); const v=i.value.trim(); if(!v)return; const it=make(v,null,null); i.value=''; select(it); };

PINS.forEach(p=>make(...p)); if(window.innerWidth<820) setZoom(1.5); cur=items[0]; drawAll(); setTimeout(()=>{ const b=board.getBoundingClientRect(); scroller.scrollLeft=b.width*cur.x/100-scroller.clientWidth/2; scroller.scrollTop=b.height*cur.y/100-scroller.clientHeight/3; },300);

document.getElementById('send').onclick=async()=>{
  const btn=document.getElementById('send'), err=document.getElementById('err'); btn.disabled=true; btn.textContent='שולח…';
  const lab={guess:'השערה (לא נגעו)',ok:'אושר/מוקם',gone:'לא קיים',skip:'דילג'};
  const data=items.map(it=>({name:it.name,status:it.x==null&&it.state!=='gone'?'לא מוקם':lab[it.state],x:it.x==null?null:+it.x.toFixed(1),y:it.y==null?null:+it.y.toFixed(1)}));
  const notes=document.getElementById('notes').value.trim();
  try{
    const fd=new FormData(); fd.append('access_key',WEB3FORMS_KEY); fd.append('subject','🗺️ מפת המתחם — FORUM — דימה'); fd.append('from_name','AI Lab · מפת המתחם');
    data.forEach((d,i)=>fd.append('P'+String(i+1).padStart(2,'0'),`${d.name} ← ${d.status}${d.x!=null?` (x=${d.x}%, y=${d.y}%)`:''}`));
    fd.append('Notes',notes||'—'); fd.append('JSON',JSON.stringify(data)); fd.append('Time',new Date().toLocaleString('he-IL'));
    const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:fd}); const j=await r.json(); if(!j.success) throw new Error(j.message);
    btn.style.display='none'; document.getElementById('done').classList.add('show'); document.getElementById('guide').style.display='none';
  }catch(x){
    btn.disabled=false; btn.textContent='שלח את המפה ←';
    err.innerHTML='השליחה נכשלה. <a style="color:#ffb3b3" target="_blank" href="https://wa.me/'+WA+'?text='+encodeURIComponent('מפת המתחם:\n'+data.map(d=>d.name+': '+d.status+(d.x!=null?' ('+d.x+','+d.y+')':'')).join('\n')+'\n'+notes)+'">לשלוח בוואטסאפ</a>'; err.style.display='block';
  }
};
</script>
</body>
</html>
